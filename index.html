<!doctype html>
<html lang="en">
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />
    <meta charset="UTF-8" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Title</title>
  </head>
  <body>
    <aside class="position-fixed top-0 start-0 vh-100 bg-dark text-white">
      <div class="p-4 border-secondary">
        <h4 class="mb-0 text-center">GAME TETRIS</h4>
      </div>
      <nav class="nav flex-column p-3">
        <a href="index.html?name=1" class="nav-link text-light mb-2">
          Level 1
        </a>
        <a href="index.html?name=2" class="nav-link text-light mb-2">
          Level 2
        </a>
        <a href="index.html?name=3" class="nav-link text-light mb-2">
          Level 3
        </a>
        <a href="index.html?name=4" class="nav-link text-light mb-2">
          Level 4
        </a>
        <a href="introduce.html" class="nav-link text-light mb-2">
          Hướng dẫn
        </a>
      </nav>
    </aside>
    <main class="right-side">
      <div class="container-lg d-flex justify-content-center">
        <div class="row title-game text-center w-100">
          <div class="col" id="name-level"></div>
          <div class="col">
            <button type="button" class="btn btn-secondary btn-play">
              Tạm dừng
            </button>
          </div>
          <div class="col" id="score-value"></div>
        </div>
      </div>
      <div class="container-fluid">
        <div class="col-12 mt-4 d-flex justify-content-center">
          <div id="main-game"></div>
        </div>
      </div>
    </main>
    <div class="modal" tabindex="-1" id="gameover" data-bs-backdrop="false">
      <div class="modal-dialog">
        <div class="modal-content bg-dark text-white">
          <div class="modal-header">
            <h5 class="modal-title">BẠN ĐÃ THUA</h5>
          </div>
          <div class="modal-body">
            <p>Bạn có muốn thử lại trò chơi này không?</p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-danger"
              data-bs-dismiss="modal"
              onclick="location.reload()"
            >
              Thử lại
            </button>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="js/game.js"></script>
  </body>
</html>
